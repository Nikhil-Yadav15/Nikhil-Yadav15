<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6EE7B7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6EE7B7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bgGrad)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.03">
    <line x1="0" y1="50" x2="1200" y2="50" stroke="#6EE7B7" stroke-width="0.5"/>
    <line x1="0" y1="100" x2="1200" y2="100" stroke="#6EE7B7" stroke-width="0.5"/>
    <line x1="0" y1="150" x2="1200" y2="150" stroke="#6EE7B7" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="#6EE7B7" stroke-width="0.5"/>
    <line x1="0" y1="250" x2="1200" y2="250" stroke="#6EE7B7" stroke-width="0.5"/>
  </g>

  <!-- Neural network / constellation pattern (right side) -->
  <g filter="url(#softGlow)">
    <!-- Layer 1 nodes (far right) -->
    <circle cx="1120" cy="60" r="4" fill="#6EE7B7" opacity="0.5"/>
    <circle cx="1140" cy="140" r="5" fill="#6EE7B7" opacity="0.4"/>
    <circle cx="1100" cy="220" r="3.5" fill="#6EE7B7" opacity="0.35"/>
    <circle cx="1150" cy="260" r="3" fill="#3B82F6" opacity="0.3"/>

    <!-- Layer 2 nodes -->
    <circle cx="1000" cy="40" r="3" fill="#6EE7B7" opacity="0.4"/>
    <circle cx="1020" cy="110" r="6" fill="#6EE7B7" opacity="0.45"/>
    <circle cx="980" cy="180" r="4" fill="#3B82F6" opacity="0.4"/>
    <circle cx="1040" cy="250" r="3.5" fill="#6EE7B7" opacity="0.3"/>
    <circle cx="1060" cy="170" r="3" fill="#3B82F6" opacity="0.35"/>

    <!-- Layer 3 nodes -->
    <circle cx="880" cy="70" r="4.5" fill="#3B82F6" opacity="0.35"/>
    <circle cx="900" cy="150" r="5" fill="#6EE7B7" opacity="0.3"/>
    <circle cx="860" cy="230" r="3.5" fill="#3B82F6" opacity="0.25"/>
    <circle cx="920" cy="200" r="3" fill="#6EE7B7" opacity="0.2"/>

    <!-- Layer 4 nodes (leftmost, fading) -->
    <circle cx="760" cy="50" r="3" fill="#6EE7B7" opacity="0.2"/>
    <circle cx="780" cy="130" r="4" fill="#3B82F6" opacity="0.2"/>
    <circle cx="740" cy="210" r="3" fill="#6EE7B7" opacity="0.15"/>
    <circle cx="800" cy="260" r="2.5" fill="#3B82F6" opacity="0.15"/>

    <!-- Scattered small nodes -->
    <circle cx="680" cy="80" r="2" fill="#6EE7B7" opacity="0.12"/>
    <circle cx="700" cy="180" r="2.5" fill="#3B82F6" opacity="0.1"/>
    <circle cx="650" cy="140" r="2" fill="#6EE7B7" opacity="0.08"/>
  </g>

  <!-- Connection lines between nodes -->
  <g stroke="url(#lineGrad)" stroke-width="1" fill="none">
    <!-- Layer 1 to Layer 2 -->
    <line x1="1120" y1="60" x2="1020" y2="110" opacity="0.3"/>
    <line x1="1120" y1="60" x2="1000" y2="40" opacity="0.25"/>
    <line x1="1140" y1="140" x2="1020" y2="110" opacity="0.35"/>
    <line x1="1140" y1="140" x2="1060" y2="170" opacity="0.3"/>
    <line x1="1140" y1="140" x2="980" y2="180" opacity="0.2"/>
    <line x1="1100" y1="220" x2="980" y2="180" opacity="0.25"/>
    <line x1="1100" y1="220" x2="1040" y2="250" opacity="0.2"/>
    <line x1="1150" y1="260" x2="1040" y2="250" opacity="0.2"/>
    <line x1="1150" y1="260" x2="1100" y2="220" opacity="0.15"/>

    <!-- Layer 2 to Layer 3 -->
    <line x1="1000" y1="40" x2="880" y2="70" opacity="0.25"/>
    <line x1="1020" y1="110" x2="880" y2="70" opacity="0.3"/>
    <line x1="1020" y1="110" x2="900" y2="150" opacity="0.3"/>
    <line x1="980" y1="180" x2="900" y2="150" opacity="0.25"/>
    <line x1="980" y1="180" x2="920" y2="200" opacity="0.2"/>
    <line x1="1060" y1="170" x2="920" y2="200" opacity="0.2"/>
    <line x1="1040" y1="250" x2="860" y2="230" opacity="0.2"/>
    <line x1="980" y1="180" x2="860" y2="230" opacity="0.15"/>

    <!-- Layer 3 to Layer 4 -->
    <line x1="880" y1="70" x2="760" y2="50" opacity="0.2"/>
    <line x1="880" y1="70" x2="780" y2="130" opacity="0.2"/>
    <line x1="900" y1="150" x2="780" y2="130" opacity="0.2"/>
    <line x1="900" y1="150" x2="740" y2="210" opacity="0.15"/>
    <line x1="920" y1="200" x2="740" y2="210" opacity="0.15"/>
    <line x1="860" y1="230" x2="800" y2="260" opacity="0.12"/>
    <line x1="860" y1="230" x2="740" y2="210" opacity="0.12"/>

    <!-- Layer 4 to scattered -->
    <line x1="760" y1="50" x2="680" y2="80" opacity="0.1"/>
    <line x1="780" y1="130" x2="700" y2="180" opacity="0.1"/>
    <line x1="780" y1="130" x2="650" y2="140" opacity="0.08"/>
  </g>

  <!-- Accent underline -->
  <rect x="60" y="155" width="70" height="4" rx="2" fill="url(#accentGrad)"/>

  <!-- Name -->
  <text x="60" y="140" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="68" font-weight="800" fill="#FFFFFF" letter-spacing="-1">Nikhil Yadav</text>

  <!-- Subtitle -->
  <text x="60" y="195" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#8b949e" letter-spacing="0.5">Full-Stack Engineer · Applied AI · Computer Vision</text>

  <!-- College line -->
  <text x="60" y="230" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#6EE7B7" letter-spacing="2" opacity="0.7">B.TECH · MNNIT ALLAHABAD</text>

  <!-- Bottom accent line -->
  <rect x="0" y="296" width="1200" height="4" fill="url(#accentGrad)" opacity="0.6"/>
</svg>
